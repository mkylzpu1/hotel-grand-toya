name: Auto-translate ja content

on:
  push:
    branches:
      - main
    paths:
      - 'src/content/**/*.ja.json'

permissions:
  contents: write

jobs:
  translate:
    if: "!contains(github.event.head_commit.message, '[skip translate]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Detect changed ja.json files
        id: changed
        run: |
          FILES=$(git diff --name-only HEAD~1 HEAD -- 'src/content/**/*.ja.json' | tr '\n' ' ')
          echo "files=$FILES" >> "$GITHUB_OUTPUT"

      - name: Translate
        if: steps.changed.outputs.files != ''
        env:
          BASE_REF: HEAD~1
        run: node scripts/translate-content.mjs ${{ steps.changed.outputs.files }}

      - name: Commit translated files
        run: |
          git config user.name "translate-bot"
          git config user.email "translate-bot@users.noreply.github.com"
          git add 'src/content/**/*.en.json' 'src/content/**/*.zh.json' 'src/content/**/*.ko.json'
          if ! git diff --cached --quiet; then
            git commit -m "chore: auto-translate ja -> en/zh/ko [skip translate]"
            git push origin HEAD:${{ github.ref_name }}
          else
            echo "翻訳による変更なし"
          fi
