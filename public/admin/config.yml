backend:
  name: github
  repo: mkylzpu1/hotel-grand-toya # TODO: リポジトリ名に置き換えてください（例: hotel-grand-toya/website）
  branch: main

# Astroのビルド確認用（実運用時はNetlifyや他のホスティングのプレビューURLに変更）
local_backend: true

publish_mode: editorial_workflow

media_folder: 'public/assets/photos'
public_folder: '/assets/photos'

# サイト全体の多言語設定。
# structure: multiple_files -> 1言語につき1ファイルを生成（例: hero.ja.json, hero.en.json）
# Astro Content Collections（src/content/**/*.{locale}.json）とそのまま対応する構成。
i18n:
  structure: multiple_files
  locales: [ja, en, zh, ko]
  default_locale: ja

collections:
  # ── サイト全体設定・フッター文言 ───────────────────────
  - name: site
    label: 'サイト設定'
    files:
      - name: site
        label: 'サイト基本情報'
        file: 'src/content/site/site.json'
        i18n: true
        fields:
          - { label: 'サイトタイトル (metaタイトル)', name: title, widget: string }
          - { label: 'サイト説明文 (meta description)', name: description, widget: text }
          - { label: '住所', name: address, widget: string, i18n: duplicate }
          - { label: '電話番号', name: tel, widget: string, i18n: duplicate }
          - { label: '予約サイトURL', name: reservationUrl, widget: string, i18n: duplicate }
          - label: 'フッター文言'
            name: footer
            widget: object
            fields:
              - { label: '「ご利用案内」見出し', name: guideHeading, widget: string }
              - { label: '「サイト情報」見出し', name: infoHeading, widget: string }
              - { label: '「ご予約」見出し', name: reservationHeading, widget: string }
              - { label: '外部予約サイトへのリンク文言', name: reservationExternalText, widget: string }
              - { label: 'コピーライト', name: copyright, widget: string, i18n: duplicate }
              - { label: 'モバイル用「電話」ラベル', name: mobileTelLabel, widget: string }
              - { label: 'モバイル用「予約」ラベル', name: mobileReserveLabel, widget: string }

  # ── ヘッダー / ドロワーナビゲーション ───────────────────────
  - name: navigation
    label: 'ナビゲーション'
    files:
      - name: navigation
        label: 'ナビゲーション'
        file: 'src/content/navigation/navigation.json'
        i18n: true
        fields:
          - label: '主要ナビ（客室・温泉など）'
            name: primaryNavItems
            widget: list
            fields:
              - { label: 'リンク先 (#rooms など。言語共通)', name: href, widget: string, i18n: duplicate }
              - { label: '表示ラベル', name: label, widget: string }
              - { label: '英語表記（常に英語で表示される小さな文字）', name: en, widget: string }
              - { label: 'アイコン文字（漢字1文字・言語共通）', name: icon, widget: string, i18n: duplicate }
          - label: '副次ナビ（会社情報・規約など）'
            name: secondaryNavItems
            widget: list
            fields:
              - { label: 'リンク先', name: href, widget: string }
              - { label: '表示ラベル', name: label, widget: string }
          - { label: '予約CTAボタン文言', name: reserveCta, widget: string }
          - { label: '電話ボタンaria-label', name: phoneAriaLabel, widget: string }
          - { label: 'メニューを開くaria-label', name: menuOpenLabel, widget: string }
          - { label: 'メニューを閉じるaria-label', name: menuCloseLabel, widget: string }
          - { label: '「SITE INFORMATION」見出し', name: siteInfoHeading, widget: string }

  # ── ヒーローセクション ───────────────────────
  - name: hero
    label: 'ヒーローセクション'
    files:
      - name: hero
        label: 'ヒーローセクション'
        file: 'src/content/hero/hero.json'
        i18n: true
        fields:
          - { label: '背景画像（言語共通）', name: image, widget: image, i18n: duplicate }
          - { label: '画像の代替テキスト (alt)', name: imageAlt, widget: string }
          - { label: 'アイキャッチ文言（例: 洞爺湖温泉）', name: eyebrow, widget: string }
          - label: '見出し（改行ごとに1項目）'
            name: titleLines
            widget: list
            field: { label: '行', name: line, widget: string }
          - { label: '説明文', name: description, widget: text }
          - { label: 'CTAボタン文言', name: ctaLabel, widget: string }
          - { label: 'CTAリンク先（言語共通）', name: ctaHref, widget: string, i18n: duplicate }

  # ── トップページ コンテンツセクション（客室・温泉・お料理・館内・コンセプト）──
  - name: top_sections
    label: 'トップページ セクション'
    folder: 'src/content/top-sections'
    create: true
    slug: '{{slug}}'
    i18n: true
    fields:
      - { label: '表示順（数字が小さいほど上に表示）', name: order, widget: number, i18n: duplicate }
      - {
          label: 'アンカーID（客室=rooms、温泉=onsen など。空欄可・言語共通）',
          name: sectionId,
          widget: string,
          required: false,
          i18n: duplicate,
        }
      - { label: 'アイコン文字（漢字1文字）', name: icon, widget: string }
      - { label: 'アイキャッチ文言（例: Rooms）', name: eyebrow, widget: string }
      - label: '見出し（改行ごとに1項目）'
        name: titleLines
        widget: list
        required: false
        field: { label: '行', name: line, widget: string }
      - label: '説明文（改行ごとに1項目）'
        name: description
        widget: list
        required: false
        field: { label: '段落', name: paragraph, widget: text }
      - { label: 'リンク文言', name: linkText, widget: string, required: false }
      - { label: 'リンク先', name: linkHref, widget: string, required: false }
      - { label: 'テキストを中央揃えにする', name: centerText, widget: boolean, required: false, default: false }
      - { label: '上部の区切り線を表示', name: showDivider, widget: boolean, required: false, default: true }
      - label: '画像3枚レイアウト時の大きい画像の位置'
        name: tallImagePosition
        widget: select
        required: false
        options: ['left', 'right']
      - label: '画像（2枚 または 3枚）'
        name: images
        widget: list
        required: false
        fields:
          - { label: '画像（言語共通）', name: src, widget: image, i18n: duplicate }
          - { label: '代替テキスト (alt)', name: alt, widget: string }
          - { label: 'CSSクラス（デザイン調整用・通常は編集不要）', name: className, widget: string, required: false, i18n: duplicate }
          - { label: 'キャプション', name: caption, widget: string, required: false }

  # ── アクセス・周辺観光セクション ───────────────────────
  - name: access
    label: 'アクセスセクション'
    files:
      - name: access
        label: 'アクセスセクション'
        file: 'src/content/access/access.json'
        i18n: true
        fields:
          - { label: 'ヒーロー画像（言語共通）', name: heroImage, widget: image, i18n: duplicate }
          - { label: '画像の代替テキスト (alt)', name: heroImageAlt, widget: string }
          - { label: 'アイキャッチ文言（例: Access）', name: eyebrow, widget: string }
          - { label: '見出し', name: heading, widget: string }
          - label: 'アクセス手段リスト'
            name: accessList
            widget: list
            fields:
              - { label: '手段（例: お車）', name: label, widget: string }
              - { label: '説明（例: 札幌市街から約2時間）', name: value, widget: string }
          - { label: '注意書き（冬季の積雪など）', name: note, widget: text }
          - { label: '「詳細はこちら」リンク文言', name: detailLinkText, widget: string }
          - { label: 'Googleマップ埋め込みURL（言語共通）', name: mapEmbedUrl, widget: string, i18n: duplicate }
          - { label: '地図のtitle属性', name: mapTitle, widget: string }
          - { label: '周辺観光の見出し', name: sceneryHeading, widget: string }
          - { label: '周辺観光の説明文', name: sceneryDescription, widget: text }
          - label: '周辺観光ギャラリー'
            name: sceneryItems
            widget: list
            fields:
              - { label: '画像（言語共通）', name: img, widget: image, i18n: duplicate }
              - { label: 'タイトル', name: title, widget: string }
              - { label: '補足（所要時間など）', name: note, widget: string }
          - { label: '「周辺観光はこちら」リンク文言', name: sceneryLinkText, widget: string }

  - name: "news-page"
    label: "お知らせページ"
    files:
      - file: "src/content/news-page/news-page.{{locale}}.json"
        label: "お知らせ"
        fields:
          - { label: "ページタイトル", name: "pageTitle", widget: "string" }
          - { label: "ページタイトル(英語表記)", name: "pageTitleEn", widget: "string" }
          - { label: "アイコン(1文字)", name: "icon", widget: "string" }
          - { label: "パンくずラベル", name: "breadcrumbLabel", widget: "string" }
          - { label: "「すべて」ラベル", name: "allCategoryLabel", widget: "string" }
          - { label: "該当なし文言", name: "emptyLabel", widget: "string" }
          - label: "カテゴリフィルター"
            name: "categoryFilters"
            widget: "list"
            fields:
              - { label: "ID", name: "id", widget: "string" }
              - { label: "表示名", name: "label", widget: "string" }
          - label: "投稿一覧"
            name: "posts"
            widget: "list"
            summary: "{{fields.date}} - {{fields.title}}"
            fields:
              - { label: "公開日", name: "date", widget: "date", date_format: "YYYY-MM-DD" }
              - label: "カテゴリ"
                name: "category"
                widget: "select"
                options: ["お知らせ", "イベント", "メンテナンス", "キャンペーン"]
              - { label: "タイトル", name: "title", widget: "string" }
              - label: "本文"
                name: "body"
                widget: "list"
                field: { label: "段落", name: "paragraph", widget: "text" }
              - { label: "重要なお知らせとして強調", name: "isImportant", widget: "boolean", default: false, required: false }
