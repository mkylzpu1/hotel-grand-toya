    fields:
      - { label: "ページタイトル", name: "pageTitle", widget: "string" }
      - { label: "ページタイトル(英語表記)", name: "pageTitleEn", widget: "string" }
      - { label: "アイコン(1文字)", name: "icon", widget: "string" }
      - { label: "パンくずラベル", name: "breadcrumbLabel", widget: "string" }
      - label: "カテゴリ一覧"
        name: "categories"
        widget: "list"
        fields:
          - { label: "ID(言語共通)", name: "id", widget: "string", i18n: duplicate }
          - { label: "アイコン", name: "icon", widget: "string" }
          - { label: "表示名", name: "label", widget: "string" }
          - label: "Q&A項目"
            name: "items"
            widget: "list"
            fields:
              - { label: "質問", name: "question", widget: "string" }
              - { label: "回答", name: "answer", widget: "text" }
      - label: "Q&Aセクション見出し"
        name: "qaSection"
        widget: "object"
        fields:
          - { label: "アイコン", name: "icon", widget: "string" }
          - { label: "アイキャッチ文言", name: "eyebrow", widget: "string" }
          - { label: "見出し", name: "heading", widget: "string" }
      - label: "お問い合わせ先"
        name: "contact"
        widget: "object"
        fields:
          - { label: "電話番号", name: "tel", widget: "string" }
          - { label: "電話の補足(受付時間など)", name: "telNote", widget: "string", required: false }
          - { label: "メールアドレス", name: "email", widget: "string" }

  # ── 関連リンク集(各ページ末尾の「関連ページ」ブロック) ─────
  - name: "related-links"
    label: "関連リンク集"
    folder: 'src/content/related-links'
    create: true
    slug: '{{slug}}'
    i18n: true
    extension: json
    format: json
    fields:
      - { label: "見出し", name: "heading", widget: "string" }
      - label: "リンク一覧"
        name: "links"
        widget: "list"
        fields:
          - { label: "識別ID(言語共通・rooms/onsen等)", name: "id", widget: "string", i18n: duplicate }
          - { label: "リンク先", name: "href", widget: "string" }
          - { label: "画像(言語共通)", name: "image", widget: "image", i18n: duplicate }
          - { label: "代替テキスト(alt)", name: "imageAlt", widget: "string" }
          - { label: "アイコン", name: "icon", widget: "string" }
          - { label: "表示ラベル", name: "label", widget: "string" }

  # ── プライバシーポリシーページ ───────────────────────
  - name: "privacy-page"
    label: "プライバシーポリシーページ"
    folder: 'src/content/privacy-page'
    create: false
    i18n: true
    extension: json
    format: json
    fields:
      - { label: "ページタイトル", name: "pageTitle", widget: "string" }
      - { label: "ページタイトル(英語表記)", name: "pageTitleEn", widget: "string" }
      - { label: "アイコン(1文字)", name: "icon", widget: "string" }
      - { label: "パンくずラベル", name: "breadcrumbLabel", widget: "string" }
      - label: "イントロ"
        name: "intro"
        widget: "object"
        fields:
          - { label: "アイキャッチ文言", name: "eyebrow", widget: "string" }
          - { label: "見出し", name: "heading", widget: "string" }
      - label: "セクション一覧"
        name: "sections"
        widget: "list"
        fields:
          - { label: "目次アンカーID(言語共通)", name: "id", widget: "string", i18n: duplicate }
          - { label: "見出し", name: "heading", widget: "string" }
          - { label: "導入文", name: "intro", widget: "text", required: false }
          - label: "段落"
            name: "paragraphs"
            widget: "list"
            required: false
            field: { label: "段落", name: "paragraph", widget: "text" }
          - label: "箇条書き"
            name: "list"
            widget: "list"
            required: false
            field: { label: "項目", name: "item", widget: "string" }

  # ── 関連情報ページ(福利厚生) ───────────────────────
  - name: "information-page"
    label: "関連情報ページ(福利厚生)"
    folder: 'src/content/information-page'
    create: false
    i18n: true
    extension: json
    format: json
    fields:
      - { label: "ページタイトル", name: "pageTitle", widget: "string" }
      - { label: "ページタイトル(英語表記)", name: "pageTitleEn", widget: "string" }
      - { label: "アイコン(1文字)", name: "icon", widget: "string" }
      - { label: "パンくずラベル", name: "breadcrumbLabel", widget: "string" }
      - label: "福利厚生セクション"
        name: "welfareSection"
        widget: "object"
        fields:
          - { label: "アイキャッチ文言", name: "eyebrow", widget: "string" }
          - { label: "見出し", name: "heading", widget: "string" }
          - { label: "説明文", name: "description", widget: "text" }
          - label: "制度一覧"
            name: "items"
            widget: "list"
            fields:
              - { label: "制度名", name: "name", widget: "string" }

  # ── 採用情報ページ ───────────────────────
  - name: "recruit-page"
    label: "採用情報ページ"
    folder: 'src/content/recruit-page'
    create: false
    i18n: true
    extension: json
    format: json
    fields:
      - { label: "ページタイトル", name: "pageTitle", widget: "string" }
      - { label: "ページタイトル(英語表記)", name: "pageTitleEn", widget: "string" }
      - { label: "アイコン(1文字)", name: "icon", widget: "string" }
      - { label: "パンくずラベル", name: "breadcrumbLabel", widget: "string" }
      - { label: "見出し(改行込み)", name: "heading", widget: "string" }
      - label: "説明文(改行ごとに1項目)"
        name: "description"
        widget: "list"
        field: { label: "段落", name: "paragraph", widget: "text" }
      - { label: "メールアドレス", name: "emailAddress", widget: "string" }
      - { label: "電話番号", name: "tel", widget: "string" }
      - { label: "電話ラベル", name: "telLabel", widget: "string" }
      - { label: "メールラベル", name: "emailLabel", widget: "string" }
      - label: "働く環境紹介"
        name: "workLife"
        widget: "object"
        fields:
          - { label: "見出し", name: "heading", widget: "string" }
          - { label: "説明文", name: "description", widget: "text" }
          - label: "職場の特徴(箇条書き)"
            name: "points"
            widget: "list"
            field: { label: "項目", name: "point", widget: "string" }
          - label: "写真"
            name: "photos"
            widget: "list"
            fields:
              - { label: "画像(言語共通)", name: "src", widget: "image", i18n: duplicate }
              - { label: "代替テキスト(alt)", name: "alt", widget: "string" }
      - { label: "募集職種セクション見出し", name: "positionsHeading", widget: "string" }
      - { label: "募集職種セクション説明文", name: "positionsDescription", widget: "text" }
      - label: "募集職種一覧"
        name: "positions"
        widget: "list"
        fields:
          - label: "募集状況"
            name: "status"
            widget: "select"
            options: ["open", "closed"]
            default: "open"
          - label: "アイコン(写真が無い場合に使用)"
            name: "icon"
            widget: "select"
            options: ["chef-hat", "bed-double", "concierge-bell"]
          - label: "写真(任意・ある場合はこちらを優先表示)"
            name: "image"
            widget: "object"
            required: false
            fields:
              - { label: "画像(言語共通)", name: "src", widget: "image", i18n: duplicate }
              - { label: "代替テキスト(alt)", name: "alt", widget: "string" }
          - { label: "職種名", name: "title", widget: "string" }
          - { label: "雇用形態", name: "employmentType", widget: "string" }
          - { label: "採用人数", name: "recruitCount", widget: "number" }
          - { label: "仕事紹介文", name: "summary", widget: "text" }
          - label: "主な仕事内容"
            name: "duties"
            widget: "list"
            field: { label: "項目", name: "duty", widget: "string" }
          - label: "給与形態"
            name: "salaryType"
            widget: "select"
            options: ["月給", "時給"]
          - { label: "給与(ざっくり表示)", name: "salaryRoughLabel", widget: "string" }
          - { label: "就業時間", name: "workingHours", widget: "string" }
          - { label: "休日・休暇", name: "holidays", widget: "string" }
          - label: "バッジ(未経験歓迎 等)"
            name: "tags"
            widget: "list"
            field: { label: "バッジ文言", name: "tag", widget: "string" }
      - { label: "採用フローセクション見出し", name: "processHeading", widget: "string" }
      - { label: "採用フローセクション説明文", name: "processDescription", widget: "text" }
      - label: "採用までの流れ(STEP)"
        name: "process"
        widget: "list"
        fields:
          - { label: "タイトル", name: "title", widget: "string" }
          - { label: "説明", name: "description", widget: "text" }
      - { label: "福利厚生セクション見出し", name: "benefitsHeading", widget: "string" }
      - label: "福利厚生一覧"
        name: "benefits"
        widget: "list"
        fields:
          - label: "アイコン"
            name: "icon"
            widget: "select"
            options: ["shield-check", "home", "car", "shirt", "globe", "sparkles"]
          - { label: "ラベル", name: "label", widget: "string" }
