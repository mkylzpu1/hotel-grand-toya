locale: 'ja'
backend:
  name: github
  repo: mkylzpu1/hotel-grand-toya # TODO: リポジトリ名に置き換えてください（例: hotel-grand-toya/website）
  branch: main
  base_url: https://dlb8r9uzp9.execute-api.ap-northeast-1.amazonaws.com
# Astroのビルド確認用（実運用時はNetlifyや他のホスティングのプレビューURLに変更）
# local_backend: true
publish_mode: editorial_workflow
media_folder: 'public/assets/photos'
public_folder: '/assets/photos'

site_url: 'https://mkylzpu1.github.io/hotel-grand-toya/ja/'
# サイト全体の多言語設定。
# structure: multiple_files -> 1言語につき1ファイルを生成（例: hero.ja.json, hero.en.json）
# Astro Content Collections（src/content/**/*.{locale}.json）とそのまま対応する構成。
i18n:
  structure: multiple_files
  locales: [ja, en, zh, ko]
  default_locale: ja
collections:
  - name: トップページ
    icon: 'home'
    label: 'トップページ'
    label_singular: 'トップページ'
    description: 'トップページの内容です。'
    folder: 'src/content'
    create: false
    delete: false
    fields:
      - { label: 'blank', name: 'blank', widget: string }
  # ── ヒーローセクション ───────────────────────
  - name: hero
    label: '最上部の画像'
    icon: 'arrow_right'
    label_singular: 'ヒーローセクション'
    description: 'トップページ最上部の大きな画像・キャッチコピーです。'
    folder: 'src/content/hero'
    create: false
    delete: false
    i18n: true
    extension: json
    format: json
    summary: '最上部の画像とキャッチコピー'
    fields:
      - { label: '背景画像（言語共通）', name: image, widget: image, i18n: duplicate }
      - { label: '画像の代替テキスト (alt)', name: imageAlt, widget: string, i18n: true }
      - { label: 'アイキャッチ文言（例: 洞爺湖温泉）', name: eyebrow, widget: string, i18n: duplicate }
      - label: '見出し（改行ごとに1項目）'
        name: titleLines
        widget: list
        i18n: true
        field: { label: '行', name: line, widget: string }
      - { label: '説明文', name: description, widget: text, i18n: true }

  # ── トップページ コンテンツセクション（客室・温泉・お料理・館内・コンセプト）──
  - name: top_sections
    label: '各紹介セクション'
    icon: 'arrow_right'
    label_singular: '紹介セクション'
    description: 'トップページ中段の「客室」「温泉」「お料理」「館内施設」等の紹介ブロックです。'
    folder: 'src/content/top-sections'
    create: false
    delete: false
    slug: '{{slug}}'
    i18n: true
    extension: json
    format: json
    summary: '{{fields.menuLabel}}'
    fields:
      - { label: '管理画面側の表示ラベル', name: menuLabel, widget: string, i18n: duplicate }
      - {
          label: '表示順（数字が小さいほど上に表示）',
          name: order,
          widget: number,
          i18n: duplicate,
        }
      - { label: 'アイコン文字（漢字1文字）', name: icon, widget: string, i18n: duplicate }
      - { label: 'アイキャッチ文言（例: Rooms）', name: eyebrow, widget: string, i18n: duplicate }
      - label: '見出し（改行ごとに1項目）'
        name: titleLines
        widget: list
        i18n: true
        required: false
        collapsed: true
        field: { label: '行', name: line, widget: string }
      - label: '説明文（改行ごとに1項目）'
        name: description
        widget: list
        i18n: true
        collapsed: true
        required: false
        field: { label: '段落', name: paragraph, widget: text }
      - {
          label: '料金の一言（客室セクションのみ使用。例: 「1泊2食付 15,000円台〜」）',
          name: priceHighlight,
          widget: string,
          required: false,
          i18n: true,
        }
      - { label: 'リンク文言', name: linkText, widget: string, required: false, i18n: true }
      - { label: 'リンク先', name: linkHref, widget: string, required: false, i18n: duplicate }
      - {
          label: '2つ目のリンク文言（例：日帰り入浴）',
          name: secondaryLinkText,
          widget: string,
          required: false,
          i18n: true,
        } # ← 追加
      - {
          label: '2つ目のリンク先',
          name: secondaryLinkHref,
          widget: string,
          required: false,
          i18n: duplicate,
        } # ← 追加
      - {
          label: 'テキストを中央揃えにする',
          name: centerText,
          widget: boolean,
          required: false,
          default: false,
          i18n: duplicate,
        }
      - {
          label: '上部の区切り線を表示',
          name: showDivider,
          widget: boolean,
          required: false,
          default: true,
          i18n: duplicate,
        }
      - label: '画像3枚レイアウト時の大きい画像の位置'
        name: tallImagePosition
        widget: select
        required: false
        i18n: duplicate
        options: ['left', 'right']
      - label: '画像（2枚 または 3枚）'
        name: images
        widget: list
        i18n: true
        required: false
        summary: '{{alt}}'
        collapsed: true
        fields:
          - { label: '画像（言語共通）', name: src, widget: image, i18n: duplicate }
          - { label: '代替テキスト (alt)', name: alt, widget: string }
          - { label: 'キャプション', name: caption, widget: string, required: false }

  # ── アクセス・周辺観光セクション（トップページ下部） ───────────────────────
  - name: access
    label: 'アクセス・周辺観光'
    icon: 'arrow_right'
    label_singular: 'トップページ アクセス欄'
    description: 'トップページ最下部の簡易アクセス案内です。詳細版は「07 アクセスページ」で編集します。'
    folder: 'src/content/access'
    create: false
    delete: false
    i18n: true
    extension: json
    format: json
    summary: '{{fields.heading}}'
    fields:
      - { label: 'ヒーロー画像（言語共通）', name: heroImage, widget: image, i18n: duplicate }
      - { label: '画像の代替テキスト (alt)', name: heroImageAlt, widget: string, i18n: true }
      - { label: 'アイキャッチ文言（例: Access）', name: eyebrow, widget: string, i18n: duplicate }
      - { label: '見出し', name: heading, widget: string, i18n: true }
      - label: 'アクセス手段リスト'
        name: accessList
        widget: list
        i18n: true
        summary: '{{label}}：{{value}}'
        collapsed: true
        fields:
          - { label: '手段（例: お車）', name: label, widget: string }
          - { label: '説明（例: 札幌市街から約2時間）', name: value, widget: string }
      - { label: '注意書き（冬季の積雪など）', name: note, widget: text, i18n: true }
      - { label: '送迎に関する注意書き', name: shuttleNote, widget: text, i18n: true }
      - { label: '「詳細はこちら」リンク文言', name: detailLinkText, widget: string, i18n: true }
      - {
          label: 'Googleマップ埋め込みURL（言語共通）',
          name: mapEmbedUrl,
          widget: string,
          i18n: duplicate,
        }
      - { label: '地図のtitle属性', name: mapTitle, widget: string, i18n: true }
      - { label: '周辺観光の見出し', name: sceneryHeading, widget: string, i18n: true }
      - { label: '周辺観光の説明文', name: sceneryDescription, widget: text, i18n: true }
      - label: '周辺観光ギャラリー'
        name: sceneryItems
        widget: list
        i18n: true
        summary: '{{title}}'
        collapsed: true
        fields:
          - { label: '画像（言語共通）', name: img, widget: image, i18n: duplicate }
          - { label: 'タイトル', name: title, widget: string }
          - { label: '補足（所要時間など）', name: note, widget: string }
      - {
          label: '「周辺観光はこちら」リンク文言',
          name: sceneryLinkText,
          widget: string,
          i18n: true,
        }
  - divider: true

  # ── 客室ページ ───────────────────────
  - name: 客室
    icon: 'hotel'
    label: '客室'
    label_singular: '客室'
    description: '客室ページの内容です。'
    folder: 'src/content'
    create: false
    delete: false
    fields:
      - { label: 'blank', name: 'blank', widget: string }

  - name: 'rooms'
    label: '客室一覧'
    icon: 'arrow_right'
    label_singular: '客室一覧'
    description: '客室タイプごとの内容です。客室ページの本文・共通設備・ご滞在案内などは「その他」で編集します。'
    folder: 'src/content/rooms'
    create: true
    delete: false
    slug: '{{slug}}'
    i18n: true
    extension: json
    format: json
    summary: '{{fields.name}}'
    fields:
      - { label: 'アイコン', name: icon, widget: string, i18n: duplicate }
      - { label: 'アイキャッチ文言', name: eyebrow, widget: string, i18n: duplicate }
      - { label: '客室名', name: name, widget: string, i18n: true }
      - label: '説明文(改行ごとに1項目)'
        name: description
        widget: list
        i18n: true
        field: { label: '段落', name: paragraph, widget: text }
      - label: '代表画像'
        name: image
        widget: object
        i18n: true
        fields:
          - { label: 'ラベル', name: label, widget: string }
          - { label: '画像(言語共通)', name: src, widget: image, required: false, i18n: duplicate }
          - { label: '代替テキスト(alt)', name: alt, widget: string, required: false }
      - label: '基本情報（自由に項目を追加・削除できます）'
        name: basicInfo
        widget: list
        i18n: true
        summary: '{{label}}：{{value}}'
        collapsed: true
        required: false
        fields:
          - { label: 'ラベル(例: 広さ)', name: label, widget: string }
          - { label: '値(例: 26㎡)', name: value, widget: string }
      - {
          label: '料金パネルのラベル(例: 「1泊2食付・お一人様」)',
          name: priceLabel,
          widget: string,
          required: false,
          i18n: true,
        }
      - {
          label: '料金目安(例: 「15,000円台〜」。単位まで含めて入力)',
          name: priceFrom,
          widget: string,
          required: false,
          i18n: true,
        }
      - label: 'フロア(部屋タイプ)'
        name: floors
        widget: list
        i18n: true
        summary: '{{label}}'
        collapsed: true
        fields:
          - { label: 'ラベル', name: label, widget: string }
          - { label: '予約サイト表示名', name: reservationName, widget: string }
          - {
              label: '予約リンク先(言語共通)',
              name: reservationUrl,
              widget: string,
              required: false,
              i18n: duplicate,
            }
          - label: 'バッジ'
            name: badges
            widget: list
            required: false
            field: { label: 'バッジ文言', name: badge, widget: string }
          - label: '画像(最大3枚)'
            name: images
            widget: list
            max: 3
            summary: '{{label}}'
            fields:
              - { label: 'ラベル', name: label, widget: string }
              - {
                  label: '画像(言語共通)',
                  name: src,
                  widget: image,
                  required: false,
                  i18n: duplicate,
                }
              - { label: '代替テキスト(alt)', name: alt, widget: string, required: false }
          - label: '説明文(改行ごとに1項目)'
            name: description
            widget: list
            field: { label: '段落', name: paragraph, widget: text }
          - {
              label: '1階の客室として扱う',
              name: isFirstFloor,
              widget: boolean,
              required: false,
              default: false,
            }

  - name: 'rooms-page'
    label: 'その他'
    icon: 'arrow_right'
    label_singular: 'その他'
    description: '客室ページの本文・共通設備・ご滞在案内など、客室タイプ以外の内容です。'
    folder: 'src/content/rooms-page'
    create: false
    delete: false
    i18n: true
    extension: json
    format: json
    summary: '客室一覧以外の設定'
    fields:
      - { label: 'ページタイトル', name: 'pageTitle', widget: 'string', i18n: true }
      - {
          label: 'ページタイトル(英語表記)',
          name: 'pageTitleEn',
          widget: 'string',
          i18n: duplicate,
        }
      - { label: 'ページアイコン(1文字)', name: 'icon', widget: 'string', i18n: duplicate }
      - {
          label: '設備セクション アイコン',
          name: 'amenitiesIcon',
          widget: 'string',
          i18n: duplicate,
        }
      - {
          label: '設備セクション アイキャッチ文言',
          name: 'amenitiesEyebrow',
          widget: 'string',
          i18n: true,
        }
      - { label: '設備セクション 見出し', name: 'amenitiesHeading', widget: 'string', i18n: true }
      - { label: '詳細CTAボタン文言', name: 'detailCtaText', widget: 'string', i18n: true }
      - {
          label: '料金目安に関する注記(季節変動の説明など)',
          name: 'priceNote',
          widget: 'text',
          required: false,
          i18n: true,
        }
      - {
          label: '重要なご案内(禁煙ルームなし等・予約前に必ず伝える事項)',
          name: 'importantNotice',
          widget: 'text',
          required: false,
          i18n: true,
        }
      - label: '共通設備一覧'
        name: 'commonAmenities'
        widget: 'list'
        i18n: true
        summary: '{{label}}'
        collapsed: true
        fields:
          - { label: 'キー(言語共通)', name: 'key', widget: 'string', i18n: duplicate }
          - { label: '表示名', name: 'label', widget: 'string' }
          - { label: '補足', name: 'note', widget: 'string', required: false }
      - label: '1階客室の注意書き'
        name: 'firstFloorNotice'
        widget: 'object'
        i18n: true
        fields:
          - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
          - label: '項目'
            name: 'items'
            widget: 'list'
            i18n: true
            field: { label: '項目', name: 'item', widget: 'string' }
      - label: 'ご滞在案内（チェックイン等）'
        name: stayNotice
        widget: object
        i18n: true
        fields:
          - { label: 'チェックインラベル', name: checkInLabel, widget: string }
          - { label: 'チェックイン時間', name: checkInValue, widget: string }
          - { label: 'チェックアウトラベル', name: checkOutLabel, widget: string }
          - { label: 'チェックアウト時間', name: checkOutValue, widget: string }
          - { label: '支払いラベル', name: paymentLabel, widget: string }
          - { label: '支払い方法', name: paymentValue, widget: string }
          - { label: 'キャンセル規定ラベル', name: cancellationLabel, widget: string }
          - { label: 'キャンセル規定', name: cancellationValue, widget: string }

  - divider: true

  - name: ご宿泊・日帰り入浴
    icon: 'bath_outdoor'
    label: 'ご宿泊・日帰り入浴'
    label_singular: 'ご宿泊・日帰り入浴'
    description: 'ご宿泊・日帰り入浴ページの内容です。'
    folder: 'src/content'
    create: false
    delete: false
    fields:
      - { label: 'blank', name: 'blank', widget: string }

  # ── 基本設定 ───────────────────────
  - name: 'onsen-page-meta'
    label: '基本設定'
    icon: 'arrow_right'
    label_singular: '基本設定'
    description: 'ページタイトルとページ内アンカーナビのみです。'
    folder: 'src/content/onsen-page-meta'
    create: false
    i18n: true
    extension: json
    format: json
    summary: '基本設定'
    fields:
      - { label: 'ページタイトル', name: 'pageTitle', widget: 'string', i18n: true }
      - {
          label: 'ページタイトル(英語表記)',
          name: 'pageTitleEn',
          widget: 'string',
          i18n: duplicate,
        }
      - { label: 'ページアイコン(1文字)', name: 'icon', widget: 'string', i18n: duplicate }

  # ── 泉質・効能 ───────────────────────
  - name: 'onsen-quality'
    label: '泉質・効能'
    icon: 'arrow_right'
    label_singular: '泉質・効能'
    description: '4つの項目は固定です。ラベル・値のどちらも自由に編集できますが、項目自体を追加・削除しないでください。'
    folder: 'src/content/onsen-quality'
    create: false
    i18n: true
    extension: json
    format: json
    summary: '{{fields.heading}}'
    fields:
      - { label: 'アイコン', name: 'icon', widget: 'string', i18n: duplicate }
      - { label: 'アイキャッチ文言', name: 'eyebrow', widget: 'string', i18n: duplicate }
      - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
      - label: '① 泉質'
        name: 'waterQuality'
        widget: 'object'
        i18n: true
        collapsed: true
        fields:
          - { label: 'ラベル', name: 'label', widget: 'string' }
          - { label: '内容', name: 'value', widget: 'text' }
      - label: '② 効能'
        name: 'benefits'
        widget: 'object'
        i18n: true
        collapsed: true
        fields:
          - { label: 'ラベル', name: 'label', widget: 'string' }
          - { label: '内容', name: 'value', widget: 'text' }
      - label: '③ 温泉の特徴'
        name: 'characteristics'
        widget: 'object'
        i18n: true
        collapsed: true
        fields:
          - { label: 'ラベル', name: 'label', widget: 'string' }
          - { label: '内容', name: 'value', widget: 'text' }
      - label: '④ 源泉情報'
        name: 'sourceInfo'
        widget: 'object'
        i18n: true
        collapsed: true
        fields:
          - { label: 'ラベル', name: 'label', widget: 'string' }
          - { label: '内容', name: 'value', widget: 'text' }

  # ── 温泉施設紹介 ───────────────────────
  - name: 'onsen-facilities'
    label: '温泉施設紹介'
    icon: 'arrow_right'
    label_singular: '温泉施設紹介'
    folder: 'src/content/onsen-facilities'
    create: false
    i18n: true
    extension: json
    format: json
    summary: '{{fields.heading}}'
    fields:
      - { label: 'アイコン', name: 'icon', widget: 'string', i18n: duplicate }
      - { label: 'アイキャッチ文言', name: 'eyebrow', widget: 'string', i18n: duplicate }
      - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
      - { label: '利用時間ラベル', name: 'hoursLabel', widget: 'string', i18n: true }
      - label: '施設一覧（大浴場・露天風呂など。増減自由）'
        name: 'items'
        widget: 'list'
        i18n: true
        summary: '{{name}}'
        collapsed: true
        fields:
          - { label: '名称', name: 'name', widget: 'string' }
          - { label: '画像(言語共通)', name: 'image', widget: 'image', i18n: duplicate }
          - { label: '代替テキスト(alt)', name: 'imageAlt', widget: 'string' }
          - { label: '説明', name: 'description', widget: 'text' }
          - { label: '利用時間', name: 'hours', widget: 'string' }

  # ── 宿泊のお客様向け利用案内 ───────────────────────
  - name: 'onsen-usage-stay'
    label: '宿泊のお客様利用案内'
    icon: 'arrow_right'
    label_singular: '宿泊のお客様利用案内'
    folder: 'src/content/onsen-usage-stay'
    create: false
    i18n: true
    extension: json
    format: json
    summary: '{{fields.heading}}'
    fields:
      - { label: 'アンカーID(言語共通)', name: 'id', widget: 'string', i18n: duplicate }
      - { label: 'アイコン', name: 'icon', widget: 'string', i18n: duplicate }
      - { label: 'アイキャッチ文言', name: 'eyebrow', widget: 'string', i18n: duplicate }
      - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
      - label: '① 利用時間'
        name: 'hours'
        widget: 'object'
        i18n: true
        fields:
          - { label: 'ラベル', name: 'label', widget: 'string' }
          - { label: '内容', name: 'value', widget: 'text' }
      - label: '② アメニティ'
        name: 'amenities'
        widget: 'object'
        i18n: true
        fields:
          - { label: 'ラベル', name: 'label', widget: 'string' }
          - { label: '内容', name: 'value', widget: 'text' }
      - label: '③ 利用上の注意'
        name: 'usageNotes'
        widget: 'object'
        i18n: true
        fields:
          - { label: 'ラベル', name: 'label', widget: 'string' }
          - { label: '内容', name: 'value', widget: 'text' }

  # ── 日帰り入浴のお客様向け利用案内 ───────────────────────
  - name: 'onsen-usage-dayuse'
    label: '日帰り入浴のお客様利用案内'
    icon: 'arrow_right'
    label_singular: '日帰り入浴のお客様向け利用案内'
    folder: 'src/content/onsen-usage-dayuse'
    create: false
    i18n: true
    extension: json
    format: json
    summary: '{{fields.heading}}'
    fields:
      - { label: 'アンカーID(言語共通)', name: 'id', widget: 'string', i18n: duplicate }
      - { label: 'アイコン', name: 'icon', widget: 'string', i18n: duplicate }
      - { label: 'アイキャッチ文言', name: 'eyebrow', widget: 'string', i18n: duplicate }
      - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
      - label: 'ご利用案内内容'
        name: 'items'
        widget: 'list'
        i18n: true
        summary: '{{label}}'
        collapsed: true
        fields:
          - { label: '名称', name: 'label', widget: 'string' }
