          - { label: '表示名', name: 'label', widget: 'string' }
  # ── お知らせ投稿 ───────────────────────
  # (このコレクションは各言語をtranslationsオブジェクト内で個別管理しているため
  #  i18n: false のままで問題ありません。変更不要)
  - name: news
    label: '09 お知らせ｜投稿一覧'
    folder: 'src/content/news'
    create: true
    slug: '{{fields.slug}}'
    i18n: false
    extension: json
    format: json
    identifier_field: 'slug'
    summary: '{{fields.date}}｜{{fields.translations.ja.title}}'
    fields:
      - {
          label: '投稿ID（URLアンカー・半角英数字）',
          name: slug,
          widget: string,
          hint: '例: fireworks-2026。同じIDは使わないでください。',
        }
      - { label: '公開日', name: date, widget: date, date_format: 'YYYY-MM-DD', default: '{{now}}' }
      - label: 'カテゴリ'
        name: category
        widget: select
        options: ['お知らせ', 'イベント', 'メンテナンス', 'キャンペーン']
      - {
          label: '重要なお知らせとして強調',
          name: isImportant,
          widget: boolean,
          default: false,
          required: false,
        }
      - label: '本文・翻訳'
        name: translations
        widget: object
        fields:
          - label: '日本語'
            name: ja
            widget: object
            fields: &newsTranslationFields
              - { label: 'タイトル', name: title, widget: string }
              - label: '本文'
                name: body
                widget: list
                hint: '1行＝1段落として表示されます。まず日本語だけ入力すれば、未翻訳の言語ページでは日本語を表示します。'
                field: { label: '段落', name: paragraph, widget: text }
          - label: '英語（未入力なら日本語を表示）'
            name: en
            widget: object
            fields: *newsTranslationFields
          - label: '中国語（未入力なら日本語を表示）'
            name: zh
            widget: object
            fields: *newsTranslationFields
          - label: '韓国語（未入力なら日本語を表示）'
            name: ko
            widget: object
            fields: *newsTranslationFields
