backend:
  name: github
  repo: mkylzpu1/hotel-grand-toya # TODO: リポジトリ名に置き換えてください（例: hotel-grand-toya/website）
  branch: main
  base_url: https://dlb8r9uzp9.execute-api.ap-northeast-1.amazonaws.com
# Astroのビルド確認用（実運用時はNetlifyや他のホスティングのプレビューURLに変更）
local_backend: true
publish_mode: editorial_workflow
media_folder: 'public/assets/photos'
public_folder: '/hotel-grand-toya/assets/photos'
# サイト全体の多言語設定。
# structure: multiple_files -> 1言語につき1ファイルを生成（例: hero.ja.json, hero.en.json）
# Astro Content Collections（src/content/**/*.{locale}.json）とそのまま対応する構成。
i18n:
  structure: multiple_files
  locales: [ja, en, zh, ko]
  default_locale: ja
collections:
  # ── ヘッダー / ドロワーナビゲーション ───────────────────────
  - name: navigation
    label: '01 サイト共通｜ヘッダー・ナビゲーション'
    folder: 'src/content/navigation'
    create: false
    i18n: true
    extension: json
    format: json
    summary: 'ヘッダー・ナビゲーション'
    fields:
      - label: '主要ナビ（客室・温泉など）'
        name: primaryNavItems
        widget: list
        i18n: true
        fields:
          - { label: 'リンク先 (#rooms など。言語共通)', name: href, widget: string }
          - { label: '表示ラベル', name: label, widget: string }
          - { label: '英語表記（常に英語で表示される小さな文字）', name: en, widget: string }
          - { label: 'アイコン文字（漢字1文字・言語共通）', name: icon, widget: string }
      - label: '副次ナビ（会社情報・規約など）'
        name: secondaryNavItems
        widget: list
        i18n: true
        fields:
          - { label: 'リンク先', name: href, widget: string }
          - { label: '表示ラベル', name: label, widget: string }
      - { label: '予約CTAボタン文言', name: reserveCta, widget: string, i18n: true }
      - { label: '電話ボタンaria-label', name: phoneAriaLabel, widget: string, i18n: true }
      - { label: 'メニューを開くaria-label', name: menuOpenLabel, widget: string, i18n: true }
      - { label: 'メニューを閉じるaria-label', name: menuCloseLabel, widget: string, i18n: true }
      - { label: '「SITE INFORMATION」見出し', name: siteInfoHeading, widget: string, i18n: true }
      - { label: '言語切替ボタンaria-label', name: langSwitcherLabel, widget: string, i18n: true }
      - label: 'スマホ版ボトムナビ'
        name: bottomNav
        widget: object
        i18n: true
        fields:
          - { label: '検索ラベル', name: bottomNavSearchLabel, widget: string }
          - { label: '電話ラベル', name: bottomNavTelLabel, widget: string }
          - { label: '予約ラベル', name: bottomNavReserveLabel, widget: string }
          - { label: 'メニューラベル', name: bottomNavMenuLabel, widget: string }
  # ── 関連リンク集(各ページ末尾の「関連ページ」ブロック) ─────
  - name: 'related-links'
    label: '01 サイト共通｜関連リンク'
    folder: 'src/content/related-links'
    create: true
    slug: '{{slug}}'
    i18n: true
    extension: json
    format: json
    fields:
      - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
      - label: 'リンク一覧'
        name: 'links'
        widget: 'list'
        i18n: true
        fields:
          - { label: '識別ID(言語共通・rooms/onsen等)', name: 'id', widget: 'string' }
          - { label: 'リンク先', name: 'href', widget: 'string' }
          - { label: '画像(言語共通)', name: 'image', widget: 'image' }
          - { label: '代替テキスト(alt)', name: 'imageAlt', widget: 'string' }
          - { label: 'アイコン', name: 'icon', widget: 'string' }
          - { label: '表示ラベル', name: 'label', widget: 'string' }
  # ── サイト全体設定・フッター文言 ───────────────────────
  - name: site
    label: '01 サイト共通｜基本情報・フッター'
    folder: 'src/content/site'
    create: false
    i18n: true
    extension: json
    format: json
    fields:
      - { label: 'サイトタイトル (metaタイトル)', name: title, widget: string, i18n: true }
      - { label: 'サイト説明文 (meta description)', name: description, widget: text, i18n: true }
      - { label: '施設名(フル)', name: name, widget: string, i18n: true }
      - { label: '郵便番号', name: postalCode, widget: string, i18n: duplicate }
      - { label: '住所', name: address, widget: string, i18n: true }
      - { label: '電話番号', name: tel, widget: string, i18n: duplicate }
      - { label: 'FAX番号', name: fax, widget: string, i18n: duplicate }
      - { label: 'メールアドレス', name: email, widget: string, i18n: duplicate }
      - { label: '電話受付時間', name: businessHours, widget: string, required: false, i18n: true }
      - label: '連絡先ラベル'
        name: contactLabels
        widget: object
        i18n: true
        fields:
          - { label: '「住所」ラベル', name: address, widget: string }
          - { label: '「電話」ラベル', name: tel, widget: string }
          - { label: '「FAX」ラベル', name: fax, widget: string }
          - { label: '「お問合せ」ラベル', name: contact, widget: string }
      - { label: '予約サイトURL', name: reservationUrl, widget: string, i18n: duplicate }
      - { label: '予約ボタン文言', name: reservationLabel, widget: string, i18n: true }
      - label: 'フッター文言'
        name: footer
        widget: object
        i18n: true
        fields:
          - { label: '「ご利用案内」見出し', name: guideHeading, widget: string, i18n: true }
          - { label: '「サイト情報」見出し', name: infoHeading, widget: string, i18n: true }
          - { label: '「ご予約」見出し', name: reservationHeading, widget: string, i18n: true }
          - {
              label: '外部予約サイトへのリンク文言',
              name: reservationExternalText,
              widget: string,
              i18n: true,
            }
          - { label: 'コピーライト', name: copyright, widget: string, i18n: duplicate }
          - { label: 'モバイル用「電話」ラベル', name: mobileTelLabel, widget: string, i18n: true }
          - {
              label: 'モバイル用「予約」ラベル',
              name: mobileReserveLabel,
              widget: string,
              i18n: true,
            }
  # ── ヒーローセクション ───────────────────────
  - name: hero
    label: '02 トップページ｜ヒーロー'
    folder: 'src/content/hero'
    create: false
    i18n: true
    extension: json
    format: json
    fields:
      - { label: '背景画像（言語共通）', name: image, widget: image, i18n: duplicate }
      - { label: '画像の代替テキスト (alt)', name: imageAlt, widget: string, i18n: true }
      - { label: 'アイキャッチ文言（例: 洞爺湖温泉）', name: eyebrow, widget: string, i18n: true }
      - label: '見出し（改行ごとに1項目）'
        name: titleLines
        widget: list
        i18n: true
        field: { label: '行', name: line, widget: string }
      - { label: '説明文', name: description, widget: text, i18n: true }
  # ── トップページ コンテンツセクション（客室・温泉・お料理・館内・コンセプト）──
  - name: top_sections
    label: '02 トップページ｜各紹介セクション'
    folder: 'src/content/top-sections'
    create: true
    slug: '{{slug}}'
    i18n: true
    extension: json
    format: json
    fields:
      - {
          label: '表示順（数字が小さいほど上に表示）',
          name: order,
          widget: number,
          i18n: duplicate,
        }
      - {
          label: 'アンカーID（客室=rooms、温泉=onsen など。空欄可・言語共通）',
          name: sectionId,
          widget: string,
          required: false,
          i18n: duplicate,
        }
      - { label: 'アイコン文字（漢字1文字）', name: icon, widget: string, i18n: duplicate }
      - { label: 'アイキャッチ文言（例: Rooms）', name: eyebrow, widget: string, i18n: true }
      - label: '見出し（改行ごとに1項目）'
        name: titleLines
        widget: list
        i18n: true
        required: false
        field: { label: '行', name: line, widget: string }
      - label: '説明文（改行ごとに1項目）'
        name: description
        widget: list
        i18n: true
        required: false
        field: { label: '段落', name: paragraph, widget: text }
      - { label: 'リンク文言', name: linkText, widget: string, required: false, i18n: true }
      - { label: 'リンク先', name: linkHref, widget: string, required: false, i18n: duplicate }
      - {
          label: 'テキストを中央揃えにする',
          name: centerText,
          widget: boolean,
          required: false,
          default: false,
          i18n: duplicate,
        }
      - {
          label: '上部の区切り線を表示',
          name: showDivider,
          widget: boolean,
          required: false,
          default: true,
          i18n: duplicate,
        }
      - label: '画像3枚レイアウト時の大きい画像の位置'
        name: tallImagePosition
        widget: select
        required: false
        i18n: duplicate
        options: ['left', 'right']
      - label: '画像（2枚 または 3枚）'
        name: images
        widget: list
        i18n: true
        required: false
        fields:
          - { label: '画像（言語共通）', name: src, widget: image }
          - { label: '代替テキスト (alt)', name: alt, widget: string }
          - {
              label: 'CSSクラス（デザイン調整用・通常は編集不要）',
              name: className,
              widget: string,
              required: false,
            }
          - { label: 'キャプション', name: caption, widget: string, required: false }
  # ── アクセス・周辺観光セクション ───────────────────────
  - name: access
    label: '02 トップページ｜アクセス・周辺観光'
    folder: 'src/content/access'
    create: false
    i18n: true
    extension: json
    format: json
    fields:
      - { label: 'ヒーロー画像（言語共通）', name: heroImage, widget: image, i18n: duplicate }
      - { label: '画像の代替テキスト (alt)', name: heroImageAlt, widget: string, i18n: true }
      - { label: 'アイキャッチ文言（例: Access）', name: eyebrow, widget: string, i18n: true }
      - { label: '見出し', name: heading, widget: string, i18n: true }
      - label: 'アクセス手段リスト'
        name: accessList
        widget: list
        i18n: true
        fields:
          - { label: '手段（例: お車）', name: label, widget: string }
          - { label: '説明（例: 札幌市街から約2時間）', name: value, widget: string }
      - { label: '注意書き（冬季の積雪など）', name: note, widget: text, i18n: true }
      - { label: '「詳細はこちら」リンク文言', name: detailLinkText, widget: string, i18n: true }
      - {
          label: 'Googleマップ埋め込みURL（言語共通）',
          name: mapEmbedUrl,
          widget: string,
          i18n: duplicate,
        }
      - { label: '地図のtitle属性', name: mapTitle, widget: string, i18n: true }
      - { label: '周辺観光の見出し', name: sceneryHeading, widget: string, i18n: true }
      - { label: '周辺観光の説明文', name: sceneryDescription, widget: text, i18n: true }
      - label: '周辺観光ギャラリー'
        name: sceneryItems
        widget: list
        i18n: true
        fields:
          - { label: '画像（言語共通）', name: img, widget: image }
          - { label: 'タイトル', name: title, widget: string }
          - { label: '補足（所要時間など）', name: note, widget: string }
      - {
          label: '「周辺観光はこちら」リンク文言',
          name: sceneryLinkText,
          widget: string,
          i18n: true,
        }
  # ── 客室ページ ───────────────────────
  - name: 'rooms-page'
    label: '03 客室ページ'
    folder: 'src/content/rooms-page'
    create: false
    i18n: true
    extension: json
    format: json
    fields:
      - { label: 'ページタイトル', name: 'pageTitle', widget: 'string', i18n: true }
      - {
          label: 'ページタイトル(英語表記)',
          name: 'pageTitleEn',
          widget: 'string',
          i18n: duplicate,
        }
      - label: 'イントロ'
        name: 'intro'
        widget: 'object'
        i18n: true
        fields:
          - { label: 'アイコン', name: 'icon', widget: 'string', i18n: duplicate }
      - label: 'ページ内アンカーナビ'
        name: 'quickNav'
        widget: 'list'
        i18n: true
        fields:
          - { label: 'リンク先(#で始まるID・言語共通)', name: 'href', widget: 'string' }
          - { label: '表示ラベル', name: 'label', widget: 'string' }
      - label: '基本情報ラベル'
        name: 'basicInfoLabels'
        widget: 'object'
        i18n: true
        fields:
          - { label: '広さ', name: 'size', widget: 'string', i18n: true }
          - { label: '定員', name: 'capacity', widget: 'string', i18n: true }
          - { label: '眺望', name: 'view', widget: 'string', i18n: true }
          - { label: '寝具', name: 'bedding', widget: 'string', i18n: true }
          - { label: '喫煙', name: 'smoking', widget: 'string', i18n: true }
      - {
          label: '設備セクション アイコン',
          name: 'amenitiesIcon',
          widget: 'string',
          i18n: duplicate,
        }
      - {
          label: '設備セクション アイキャッチ文言',
          name: 'amenitiesEyebrow',
          widget: 'string',
          i18n: true,
        }
      - { label: '設備セクション 見出し', name: 'amenitiesHeading', widget: 'string', i18n: true }
      - { label: '詳細CTAボタン文言', name: 'detailCtaText', widget: 'string', i18n: true }
      - label: '共通設備一覧'
        name: 'commonAmenities'
        widget: 'list'
        i18n: true
        fields:
          - { label: 'キー(言語共通)', name: 'key', widget: 'string' }
          - { label: '表示名', name: 'label', widget: 'string' }
          - { label: '補足', name: 'note', widget: 'string', required: false }
      - label: '1階客室の注意書き'
        name: 'firstFloorNotice'
        widget: 'object'
        i18n: true
        fields:
          - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
          - label: '項目'
            name: 'items'
            widget: 'list'
            i18n: true
            field: { label: '項目', name: 'item', widget: 'string' }
      - label: '客室セクション(和室・洋室)'
        name: 'sections'
        widget: 'list'
        # 客室名・説明・画像・設備値など、この配下すべてを丸ごと1言語につき1エントリとして
        # 個別に編集できるようにする（Decapの仕様上、list内の子フィールドごとの
        # i18n: duplicate / i18n: true 指定は無視されるため、リスト単位で指定する）
        i18n: true
        fields:
          - { label: 'アンカーID(言語共通)', name: 'id', widget: 'string' }
          - label: '客室一覧'
            name: 'rooms'
            widget: 'list'
            fields:
              - { label: 'アンカーID(言語共通)', name: 'id', widget: 'string' }
              - { label: 'アイコン', name: 'icon', widget: 'string' }
              - { label: 'アイキャッチ文言', name: 'eyebrow', widget: 'string' }
              - { label: '客室名', name: 'name', widget: 'string' }
              - label: '説明文(改行ごとに1項目)'
                name: 'description'
                widget: 'list'
                field: { label: '段落', name: 'paragraph', widget: 'text' }
              - label: '代表画像'
                name: 'image'
                widget: 'object'
                fields:
                  - { label: 'ラベル', name: 'label', widget: 'string' }
                  - { label: '画像(言語共通)', name: 'src', widget: 'image', required: false }
                  - { label: '代替テキスト(alt)', name: 'alt', widget: 'string', required: false }
              - { label: '広さ', name: 'size', widget: 'string', required: false }
              - { label: '定員', name: 'capacity', widget: 'string' }
              - { label: '寝具', name: 'bedding', widget: 'string' }
              - { label: '眺望', name: 'view', widget: 'string' }
              - { label: '喫煙', name: 'smoking', widget: 'string' }
              - label: 'フロア(部屋タイプ)'
                name: 'floors'
                widget: 'list'
                fields:
                  - { label: 'ラベル', name: 'label', widget: 'string' }
                  - { label: '予約サイト表示名', name: 'reservationName', widget: 'string' }
                  - {
                      label: '予約リンク先(言語共通)',
                      name: 'reservationUrl',
                      widget: 'string',
                      required: false,
                    }
                  - label: 'バッジ'
                    name: 'badges'
                    widget: 'list'
                    required: false
                    field: { label: 'バッジ文言', name: 'badge', widget: 'string' }
                  - label: '画像(最大3枚)'
                    name: 'images'
                    widget: 'list'
                    max: 3
                    fields:
                      - { label: 'ラベル', name: 'label', widget: 'string' }
                      - { label: '画像(言語共通)', name: 'src', widget: 'image', required: false }
                      - {
                          label: '代替テキスト(alt)',
                          name: 'alt',
                          widget: 'string',
                          required: false,
                        }
                  - label: '説明文(改行ごとに1項目)'
                    name: 'description'
                    widget: 'list'
                    field: { label: '段落', name: 'paragraph', widget: 'text' }
                  - {
                      label: '1階の客室として扱う',
                      name: 'isFirstFloor',
                      widget: 'boolean',
                      required: false,
                      default: false,
                    }
  # ── 温泉ページ ───────────────────────
  - name: 'onsen-page'
    label: '04 温泉ページ'
    folder: 'src/content/onsen-page'
    create: false
    i18n: true
    extension: json
    format: json
    fields:
      - { label: 'ページタイトル', name: 'pageTitle', widget: 'string', i18n: true }
      - {
          label: 'ページタイトル(英語表記)',
          name: 'pageTitleEn',
          widget: 'string',
          i18n: duplicate,
        }
      - { label: 'アイコン(1文字)', name: 'icon', widget: 'string', i18n: duplicate }
      - label: 'ページ内アンカーナビ'
        name: 'quickNav'
        widget: 'list'
        i18n: true
        fields:
          - { label: 'リンク先(#で始まるID・言語共通)', name: 'href', widget: 'string' }
          - { label: '表示ラベル', name: 'label', widget: 'string' }
      - label: '泉質セクション'
        name: 'quality'
        widget: 'object'
        i18n: true
        fields:
          - { label: 'アイコン', name: 'icon', widget: 'string', i18n: duplicate }
          - { label: 'アイキャッチ文言', name: 'eyebrow', widget: 'string', i18n: true }
          - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
          - label: '項目'
            name: 'items'
            widget: 'list'
            i18n: true
            fields:
              - { label: 'ラベル', name: 'label', widget: 'string' }
              - { label: '値', name: 'value', widget: 'string' }
      - label: '施設紹介セクション'
        name: 'facilities'
        widget: 'object'
        i18n: true
        fields:
          - { label: 'アイコン', name: 'icon', widget: 'string', i18n: duplicate }
          - { label: 'アイキャッチ文言', name: 'eyebrow', widget: 'string', i18n: true }
          - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
          - label: '施設一覧'
            name: 'items'
            widget: 'list'
            i18n: true
            fields:
              - { label: '名称', name: 'name', widget: 'string' }
              - { label: '画像(言語共通)', name: 'image', widget: 'image' }
              - { label: '代替テキスト(alt)', name: 'imageAlt', widget: 'string' }
              - { label: '説明', name: 'description', widget: 'text' }
              - { label: '利用時間', name: 'hours', widget: 'string' }
      - label: '宿泊者向け案内'
        name: 'stay'
        widget: 'object'
        i18n: true
        fields:
          - { label: 'アンカーID(言語共通)', name: 'id', widget: 'string', i18n: duplicate }
          - { label: 'アイコン', name: 'icon', widget: 'string', i18n: duplicate }
          - { label: 'アイキャッチ文言', name: 'eyebrow', widget: 'string', i18n: true }
          - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
          - label: '項目'
            name: 'items'
            widget: 'list'
            i18n: true
            fields:
              - { label: 'ラベル', name: 'label', widget: 'string' }
              - { label: '値', name: 'value', widget: 'string' }
          - label: '注意書き'
            name: 'notes'
            widget: 'list'
            i18n: true
            required: false
            field: { label: '項目', name: 'note', widget: 'string' }
      - label: '日帰り利用案内'
        name: 'dayUse'
        widget: 'object'
        i18n: true
        fields:
          - { label: 'アンカーID(言語共通)', name: 'id', widget: 'string', i18n: duplicate }
          - { label: 'アイコン', name: 'icon', widget: 'string', i18n: duplicate }
          - { label: 'アイキャッチ文言', name: 'eyebrow', widget: 'string', i18n: true }
          - { label: '見出し', name: 'heading', widget: 'string', i18n: true }
          - label: '項目'
            name: 'items'
            widget: 'list'
            i18n: true
            fields:
              - { label: 'ラベル', name: 'label', widget: 'string' }
              - { label: '値', name: 'value', widget: 'string' }
          - label: '注意書き'
            name: 'notes'
            widget: 'list'
            i18n: true
            required: false
            field: { label: '項目', name: 'note', widget: 'string' }
